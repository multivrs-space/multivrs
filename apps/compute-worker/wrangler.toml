name = "multivrs-compute"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[containers]]
class_name = "SwiftRustContainer"
image = "./Dockerfile"
max_instances = 25
# A full vCPU, like a serverless function gets elsewhere. On lite (1/16 vCPU)
# a server-rendered page took about a second. Memory and disk bill while running.
instance_type = "standard-2"

[[durable_objects.bindings]]
name = "RUNTIME"
class_name = "SwiftRustContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SwiftRustContainer"]

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "multivrs-artifacts"

[vars]
CONTROL_PLANE_URL = "https://multivrs.space"
